name: HUMANITY Browser Layout Smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'upgrades.css'
      - 'globe-rush-party.css'
      - 'globe-rush-space.css'
      - 'humanity-layout-guard.css'
      - 'humanity-atlas-polish.css'
      - 'humanity-layout-fixes.css'
      - 'admin.html'
      - 'admin.css'
      - 'admin.js'
      - 'app.js'
      - 'scripts/ui-smoke.cjs'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  browser-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out HUMANITY
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for this commit to be published on GitHub Pages
        uses: actions/github-script@v7
        with:
          script: |
            const expectedSha = context.sha;
            const deadline = Date.now() + 180000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main',
                per_page: 100
              });
              const pages = data.workflow_runs.find(run =>
                run.head_sha === expectedSha && run.name === 'pages build and deployment'
              );
              if (pages && pages.status === 'completed') {
                if (pages.conclusion !== 'success') {
                  core.setFailed('GitHub Pages did not publish this commit successfully.');
                  return;
                }
                core.info('GitHub Pages published commit ' + expectedSha + '.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('Timed out while waiting for this commit to reach GitHub Pages.');
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save --no-package-lock playwright@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check responsive layouts and visible game controls
        run: node scripts/ui-smoke.cjs
        env:
          HUMANITY_SITE_URL: https://echoairgroup.github.io/HUMANITY/
          HUMANITY_API_ROOT: https://humanity-api-jyk5.onrender.com/api
