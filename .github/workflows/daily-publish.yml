name: Publish Atlas Daily

on:
  schedule:
    - cron: '1 0 * * *'
  workflow_dispatch:

concurrency:
  group: humanity-daily-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ensure-daily-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wake the API and ensure today's UTC edition exists
        env:
          API_URL: https://humanity-api-jyk5.onrender.com/api/daily/current
        run: |
          node --input-type=module <<'NODE'
          const expectedDate = new Date().toISOString().slice(0, 10);
          const maxAttempts = 3;
          let lastError;

          for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
            try {
              const response = await fetch(process.env.API_URL, {
                headers: {
                  Accept: 'application/json',
                  'X-Humanity-Guest': 'daily-publisher-workflow'
                },
                cache: 'no-store',
                signal: AbortSignal.timeout(90000)
              });

              const raw = await response.text();
              let payload;
              try {
                payload = JSON.parse(raw);
              } catch {
                throw new Error('API returned a non-JSON response (HTTP ' + response.status + ').');
              }

              if (!response.ok || payload.ok !== true || payload.questionCount !== 7) {
                throw new Error('Atlas Daily is not ready (HTTP ' + response.status + '): ' + JSON.stringify({
                  ok: payload.ok,
                  date: payload.date,
                  questionCount: payload.questionCount,
                  error: payload.error
                }));
              }

              if (payload.date !== expectedDate) {
                throw new Error('Atlas Daily date mismatch: expected ' + expectedDate + ', received ' + payload.date + '.');
              }

              console.log('Atlas Daily is ready for ' + payload.date + ' with ' + payload.questionCount + ' shared questions.');
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.warn('Attempt ' + attempt + '/' + maxAttempts + ' failed: ' + error.message);
              if (attempt < maxAttempts) {
                const delayMs = attempt * 10000;
                console.log('Retrying in ' + Math.round(delayMs / 1000) + ' seconds.');
                await new Promise(resolve => setTimeout(resolve, delayMs));
              }
            }
          }

          throw new Error('Could not publish today\'s Atlas Daily after ' + maxAttempts + ' attempts. Last error: ' + (lastError?.message || 'unknown error'));
          NODE
