name: Globe Rush live smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-party-smoke.yml'
      - 'backend/atlas-party-smoke.js'
      - 'backend/game-server.js'
      - 'backend/party-server.js'
      - 'backend/geography-engine.js'
      - 'backend/package.json'
      - 'backend/schema-geography.sql'
  workflow_dispatch:

concurrency:
  group: humanity-globe-rush-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-game:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out HUMANITY
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install --prefix backend --ignore-scripts
      - name: Check the live API and Globe Rush WebSocket flow
        run: node backend/atlas-party-smoke.js
        env:
          HUMANITY_PARTY_WS_URL: wss://humanity-api-jyk5.onrender.com/api/party
          HUMANITY_API_ROOT: https://humanity-api-jyk5.onrender.com/api
