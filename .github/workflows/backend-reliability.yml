name: HUMANITY Backend Reliability

on:
  schedule:
    - cron: '15 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: humanity-backend-reliability
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check backend, Neon connection and today's Atlas Daily
        env:
          API_ROOT: https://humanity-api-jyk5.onrender.com/api
        run: |
          node --input-type=module <<'NODE'
          const expectedDate = new Date().toISOString().slice(0, 10);
          const maxAttempts = 3;

          async function requestJson(path, extraHeaders = {}) {
            let lastError;

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              try {
                const response = await fetch(process.env.API_ROOT + path, {
                  headers: {
                    Accept: 'application/json',
                    ...extraHeaders
                  },
                  cache: 'no-store',
                  signal: AbortSignal.timeout(90000)
                });

                const raw = await response.text();
                let payload;
                try {
                  payload = JSON.parse(raw);
                } catch {
                  throw new Error(path + ' returned a non-JSON response (HTTP ' + response.status + ').');
                }

                if (!response.ok || payload.ok !== true) {
                  throw new Error(path + ' failed (HTTP ' + response.status + '): ' + (payload.error || 'unexpected response'));
                }

                return payload;
              } catch (error) {
                lastError = error;
                console.warn(path + ' attempt ' + attempt + '/' + maxAttempts + ' failed: ' + error.message);
                if (attempt < maxAttempts) {
                  await new Promise(resolve => setTimeout(resolve, attempt * 10000));
                }
              }
            }

            throw new Error(path + ' remains unavailable after ' + maxAttempts + ' attempts. Last error: ' + (lastError?.message || 'unknown error'));
          }

          const health = await requestJson('/health');
          if (health.database !== true) {
            throw new Error('The API is responding, but its Neon database check is not healthy.');
          }

          const daily = await requestJson('/daily/current', {
            'X-Humanity-Guest': 'scheduled-health-check'
          });
          if (daily.questionCount !== 7 || daily.date !== expectedDate) {
            throw new Error('Atlas Daily is not ready for ' + expectedDate + ': received ' + daily.date + ' with ' + daily.questionCount + ' questions.');
          }

          console.log('HUMANITY API: healthy');
          console.log('Neon PostgreSQL: connected');
          console.log('Atlas Daily: ' + daily.date + ' (' + daily.questionCount + ' questions)');
          console.log('Backend uptime at check: ' + Number(health.uptimeSeconds || 0) + ' seconds');
          NODE
